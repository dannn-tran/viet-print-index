[publication]
id = "bachkhoa"
name = "Bach Khoa"

[target]
type = "gcs"
project = "vie-ocr"
bucket = "vie-doc"
pdf_prefix = "bachkhoa/pdf"
images_prefix = "bachkhoa/images"
ocr_output_prefix = "bachkhoa/ocr"

[source]
type = "local_dir"
path = "../data/bachkhoa/pdf"
# original: http://ndclnh-mytho-usa.org/bachkhoa.htm

[explode]
# Run `vie-pipeline calibrate bachkhoa --pdf <file>` to determine best params
preserve_crop = true
negate_png = false
preserve_orientation = false
no_text = false
dpi = 300

[ocr]
language_hints = ["vi"]
