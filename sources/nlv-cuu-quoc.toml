[publication]
id = "nlv-cuu-quoc"
name = "Cứu Quốc (National Library of Vietnam)"

[target]
type = "gcs"
project = "vie-ocr"
bucket = "vie-doc"
pdf_prefix = "nlv-cuu-quoc/pdf"
images_prefix = "nlv-cuu-quoc/images"
ocr_output_prefix = "nlv-cuu-quoc/ocr"

[source]
type = "veridian"
catalogue_url = "http://baochi.nlv.gov.vn/baochi/cgi-bin/baochi"
image_server_url = "http://baochi.nlv.gov.vn/baochi/cgi-bin/imageserver/imageserver.pl"
title_id = "WNyf"
from_date = "1945-09-01"
to_date = "1955-04-30"
# Public source: keep a conservative request rate and use one worker.

[source_requests]
max_concurrent_requests = 2
min_interval_seconds = 1.0
max_attempts = 5
backoff_factor = 1.0
backoff_max_seconds = 30.0
backoff_jitter_seconds = 0.5

[explode]
# Veridian ingestion fetches full-page JPEGs directly; explode is skipped.
dpi = 300

[ocr]
language_hints = ["vi"]
