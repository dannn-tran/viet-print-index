[project]
name = "vie-doc-pipeline"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "typer",
    "gc-vision-adapter",
    "vie-doc-data",
    "pymupdf>=1.25",
    "urllib3>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
]

[tool.uv]
package = true

[tool.uv.sources]
gc-vision-adapter = { workspace = true }
vie-doc-data = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/gc-vision-adapter",
    "packages/vie-doc-ingest-cli",
    "packages/vie-doc-data",
]

[tool.ruff.lint]
select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[project.scripts]
vie-pipeline = "vie_doc_pipeline.cli:app"
