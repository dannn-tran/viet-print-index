[project]
name = "vie-doc-pipeline"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "typer",
    "gc-vision-adapter",
    "vie-doc-data",
    "pymupdf>=1.25",
]

[tool.uv]
package = true

[tool.uv.sources]
gc-vision-adapter = { workspace = true }
vie-doc-data = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/gc-vision-adapter",
    "packages/vie-doc-ingest-cli",
    "packages/vie-doc-data",
]

[project.scripts]
vie-pipeline = "vie_doc_pipeline.vie_pipeline:app"
